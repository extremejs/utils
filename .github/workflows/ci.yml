name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  knip:
    name: Knip

    runs-on: ubuntu-latest

    timeout-minutes: 5

    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Check dead code/deps
        run: pnpm knip

  build:
    name: Build

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Build the project
        run: pnpm build

  lint-typecheck:
    name: Lint & Type check

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Check code styles & types
        run: pnpm lint:typecheck

  document:
    name: Document

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Generate code documents
        run: pnpm document

  commitlint:
    name: Commit Lint

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Check commit messages
        if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  test:
    name: Test

    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        node-version:
          - 24
          - 26

    runs-on: ${{ matrix.os }}

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@${{ matrix.node-version }}

      - name: Test the project
        run: pnpm test

  coverage:
    name: Report Code Coverage

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Collect code coverage
        run: pnpm test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: REF
          fail_ci_if_error: true
        env:
          REF: ${{ github.ref_name }}

  test-summary:
    name: Test Summary

    needs:
      - knip
      - build
      - lint-typecheck
      - document
      - commitlint
      - test
      - coverage

    if: ${{ always() && github.event_name == 'pull_request' }}

    runs-on: ubuntu-latest

    steps:
      - name: Check ci status
        if: ${{ needs.knip.result != 'success' || needs.build.result != 'success' || needs.lint-typecheck.result != 'success' || needs.document.result != 'success' || needs.commitlint.result != 'success' || needs.test.result != 'success' || needs.coverage.result != 'success' }}
        run: exit 1
