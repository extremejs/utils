name: CD

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  changelog:
    name: Generate Changelogs

    concurrency:
      group: ${{ github.workflow }}-changelog-${{ github.ref_name }}
      cancel-in-progress: true

    runs-on: ubuntu-latest

    timeout-minutes: 5

    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      prerelease: ${{ steps.changelog.outputs.prerelease }}
      release-id: ${{ steps.changelog.outputs.release-id }}

    steps:
      - name: Changelog
        id: changelog
        uses: ardalanamini/auto-changelog@v5

  release:
    name: Create Release

    needs:
      - changelog

    permissions:
      contents: write

    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: true

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ needs.changelog.outputs.changelog }}
          prerelease: ${{ needs.changelog.outputs.prerelease }}

  documents:
    name: Publish Documents

    needs:
      - changelog

    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

    environment:
      name: documents
      url: ${{ steps.github-pages-deployment.outputs.page_url }}

    concurrency:
      group: ${{ github.workflow }}-documents
      cancel-in-progress: true

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Generate code documents
        run: pnpm document

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: github-pages-deployment
        uses: actions/deploy-pages@v5

  npm:
    name: Publish to NPM

    needs:
      - changelog

    permissions:
      contents: read
      id-token: write

    environment:
      name: npm
      url: https://www.npmjs.com/package/@${{ github.repository }}

    concurrency:
      group: ${{ github.workflow }}-npm-${{ github.ref_name }}
      cancel-in-progress: true

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Publish the package
        run: pnpm publish --no-git-checks --tag ${{ needs.changelog.outputs.release-id }}
